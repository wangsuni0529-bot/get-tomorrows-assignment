[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "get-tomorrows-assignment"
version = "1.0.0"
description = "A study agenda that separates Canvas deadlines from possible prep."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Suni Wang"}]
dependencies = [
  "requests==2.32.5",
  "python-dotenv==1.2.4",
  "pypdf==6.4.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.6"]

[project.scripts]
study-agent = "study_agent.agent:main"
study-agenda = "study_agent.agenda:main"
canvas-tomorrow = "study_agent.tomorrow:main"
study-web = "study_agent.web:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
